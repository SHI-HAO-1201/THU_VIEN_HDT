<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f0e7">
  <title>Đăng nhập hệ thống · Mộc Thư</title>
  <link rel="stylesheet" href="../../dùng-chung/giao%20di%E1%BB%87n/giao-di%E1%BB%87n.css">
  <link rel="stylesheet" href="dang-nhap.css">
</head>
<body class="auth-page">
  <main class="login-card">
    <header class="login-card-head">
      <a class="back-home" href="/">← Trang chủ</a>
      <a class="auth-brandline" href="/"><img src="../../dùng-chung/giao%20di%E1%BB%87n/logo-moc-thu.png" alt=""><span>Mộc Thư</span></a>
      <p class="step-label" id="roleLabel">CỔNG THÔNG TIN THƯ VIỆN</p>
      <h1 id="authTitle">Đăng nhập hệ thống</h1>
      <p class="auth-intro" id="authIntro">Nhập thông tin để tiếp tục.</p>
    </header>
    <div class="auth-error" id="authError" role="alert" hidden></div>
    <form id="loginForm" class="auth-form" hidden>
      <label>Tên đăng nhập hoặc email<input name="username" type="text" autocomplete="username" required></label>
      <label>Mật khẩu<span class="password-field"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button class="show-password" type="button" data-toggle-password="loginPassword" aria-label="Hiện mật khẩu">Hiện</button></span></label>
      <div class="form-row"><label class="remember"><input type="checkbox" name="remember"> Ghi nhớ tên đăng nhập</label><button class="text-link" id="forgotLink" type="button">Quên mật khẩu?</button></div>
      <button class="button primary auth-submit" type="submit">Đăng nhập</button>
    </form>
    <section class="demo-login" id="demoLogin" hidden aria-label="Đăng nhập tài khoản demo">
      <p>Dùng nhanh tài khoản demo</p>
      <div class="demo-login-buttons">
        <button class="demo-login-button" type="button" data-demo-role="reader">Vào trang độc giả</button>
        <button class="demo-login-button" type="button" data-demo-role="librarian">Vào trang thủ thư</button>
        <button class="demo-login-button" type="button" data-demo-role="admin">Vào trang quản trị</button>
      </div>
    </section>
    <form id="signupForm" class="auth-form" hidden>
      <label>Họ và tên<input name="fullName" autocomplete="name" required maxlength="100"></label>
      <label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required maxlength="255"></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Nhập lại mật khẩu<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
      <button class="button primary auth-submit" type="submit">Tạo tài khoản độc giả</button>
    </form>
    <form id="forgotForm" class="auth-form" hidden>
      <p class="setup-note">Nhập email đã đăng ký nếu tài khoản có email. Mã dùng một lần sẽ hiện trong cửa sổ máy chủ.</p>
      <label>Tên đăng nhập<input name="username" autocomplete="username" required></label>
      <label>Email (nếu đã đăng ký)<input name="email" type="email" autocomplete="email"></label>
      <button class="button primary auth-submit" type="submit">Gửi mã khôi phục</button>
      <button class="text-link" type="button" data-show-login>Quay lại đăng nhập</button>
    </form>
    <form id="resetForm" class="auth-form" hidden>
      <p class="setup-note">Mã khôi phục chỉ dùng một lần và hết hạn sau 15 phút.</p>
      <label>Mã khôi phục<input name="token" autocomplete="one-time-code" required></label>
      <label>Mật khẩu mới<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Nhập lại mật khẩu mới<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
      <button class="button primary auth-submit" type="submit">Đặt lại mật khẩu</button>
      <button class="text-link" type="button" data-show-login>Quay lại đăng nhập</button>
    </form>
    <p class="auth-switch" id="authSwitch" hidden><span id="authSwitchText"></span> <button class="text-link" id="authSwitchButton" type="button">Đăng ký</button></p>
  </main>
  <script src="../ch%E1%BB%A9c%20n%C4%83ng/dang-nhap.js"></script>
</body>
</html>
