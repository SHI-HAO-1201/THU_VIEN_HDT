<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f6f0">
  <title>Đăng nhập · Mộc Thư</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../dùng-chung/giao%20di%E1%BB%87n/giao-di%E1%BB%87n.css">
  <link rel="stylesheet" href="dang-nhap.css">
</head>
<body class="auth-page">
  <main class="auth-card card" style="text-align:center;">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
      <img src="../../dùng-chung/giao%20di%E1%BB%87n/logo-moc-thu.png" alt="Logo Mộc Thư" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
      <a class="auth-brand" href="/" style="font-size:26px;">Mộc Thư</a>
    </div>
    <p class="auth-kicker">KHÔNG GIAN TRI THỨC</p>
    <h1 id="authTitle" style="text-align:center;">Đăng nhập</h1>
    <p class="auth-intro" id="authIntro" style="text-align:center;">Đăng nhập để vào đúng khu vực làm việc của bạn.</p>
    <div class="auth-error" id="authError" role="alert" hidden></div>

    <form id="loginForm" class="auth-form" hidden>
      <label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" required></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary auth-submit" type="submit">Đăng nhập</button>
      
    </form>

    <form id="setupForm" class="auth-form" hidden>
      <p class="setup-note">Tạo tài khoản quản trị đầu tiên. Mật khẩu cần ít nhất 12 ký tự.</p>
      <label>Họ và tên<input name="fullName" autocomplete="name" required maxlength="100"></label>
      <label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
      <button class="button primary auth-submit" type="submit">Tạo quản trị viên</button>
    </form>
    <form id="readerSignupForm" class="auth-form" hidden>
      <p class="setup-note">Tài khoản này dùng để đăng nhập. Thẻ thư viện là hồ sơ riêng do thư viện cấp.</p>
      <label>Họ và tên<input name="fullName" autocomplete="name" required maxlength="100"></label>
      <label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required maxlength="255"></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Nhập lại mật khẩu<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
      <button class="button primary auth-submit" type="submit">Tạo tài khoản độc giả</button>
    </form>
    <p class="auth-footnote" id="authSwitch"><span id="authSwitchText">Chưa có tài khoản độc giả?</span> <button class="text-link" id="authSwitchButton" type="button" hidden>Tạo tài khoản</button></p>
  </main>
  <script src="../chức%20n%C4%83ng/dang-nhap.js"></script>
</body>
</html>
